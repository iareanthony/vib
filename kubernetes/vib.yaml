apiVersion: v1
kind: Namespace
metadata:
  name: security
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vib-scanner
  namespace: security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vib-scanner
    rules:
      - apiGroups: [""]
        resources:
          - pods
        verbs:
         - get
         - list
         - watch

      - apiGroups: ["apps"]
        resources:
          - replicasets
        verbs:
          - get
          - list
          - watch

      - apiGroups: ["batch"]
        resources:
          - jobs
        verbs:
          - get
          - list
          - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vib-scanner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vib-scanner
subjects:
  - kind: ServiceAccount
    name: vib-scanner
    namespace: security
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vib-trivy-cache
  namespace: security
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vib-victoriametrics
  namespace: security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vib-victoriametrics
  template:
    metadata:
      labels:
        app: vib-victoriametrics
    spec:
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:latest
          args:
            - --storageDataPath=/storage
            - --retentionPeriod=90d
            - --httpListenAddr=:8428
            - --search.maxStalenessInterval=7h
          ports:
            - name: http
              containerPort: 8428
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /storage
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vib-victoriametrics-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vib-victoriametrics-data
  namespace: security
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vib-victoriametrics
  namespace: security
spec:
  selector:
    app: vib-victoriametrics
  ports:
    - name: http
      port: 8428
      targetPort: 8428
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vib-scanner
  namespace: security
spec:
  timeZone: America/New_York
  schedule: "0 */6 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app: vib-scanner
        spec:
          serviceAccountName: vib-scanner
          restartPolicy: Never
          containers:
            - name: scanner
              image: ghcr.io/iareanthony/vib-scanner:feature-kubernetes-discovery
              imagePullPolicy: Always
              args:
                - --once
              env:
                - name: DISCOVERY_PROVIDER
                  value: kubernetes
                - name: KUBERNETES_CLUSTER_NAME
                  value: amftech
                - name: VICTORIAMETRICS_URL
                  value: http://vib-victoriametrics.security.svc.cluster.local:8428
                - name: SEVERITY_FILTER
                  value: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
                - name: IGNORE_UNFIXED
                  value: "false"
                - name: TRIVY_TIMEOUT
                  value: "600"
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 4Gi
              volumeMounts:
                - name: trivy-cache
                  mountPath: /root/.cache/trivy
          volumes:
            - name: trivy-cache
              persistentVolumeClaim:
                claimName: vib-trivy-cache
